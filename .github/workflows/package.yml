name: Prepare release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run registry:validate
      - run: npm test
      - run: npm run coverage
      - run: npm run package
      - run: node scripts/check-public.mjs
      - run: npm run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: shrinkcage-release-candidate
          path: release/
