name: Discover optimizer candidates
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Collect public metadata without running candidate code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/registry-discover.mjs --max 8 --community --packages
      - run: node --import tsx scripts/registry-validate.mjs
      - name: Prepare a review-only pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- registry/review-queue.json registry/discovery-state.json; then exit 0; fi
          branch="registry/discovery-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/review-queue.json registry/discovery-state.json
          git commit -m "Queue optimizer metadata for maintainer review"
          git push origin "$branch"
          cat > /tmp/registry-review-body.md <<'BODY'
          Public metadata discovery only. New candidates and version changes require maintainer review through all eight admission gates. This PR does not modify the approved catalog, execute candidate code, install software or change local configurations. See the discovery artifact for rate limits and partial failures.
          BODY
          if ! gh pr create --base main --head "$branch" --title "Review discovered optimizer candidates" --body-file /tmp/registry-review-body.md; then
            echo "PR creation was denied. Candidate evidence remains on $branch and in the artifact; a maintainer must open the review PR." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-discovery-evidence
          path: artifacts/registry-discovery.json
