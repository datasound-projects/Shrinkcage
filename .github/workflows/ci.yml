name: Verify Shrinkcage
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.14.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run registry:validate
      - run: npm test
      - run: npm run coverage
      - run: npm run package
      - run: node scripts/check-public.mjs
      - run: npm run smoke
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/ui-test.mjs
      - run: node --import tsx scripts/control-ui-test.mjs
      - run: node --import tsx scripts/registry-ui-test.mjs
      - run: node --import tsx scripts/terminal-ui-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: artifacts/
